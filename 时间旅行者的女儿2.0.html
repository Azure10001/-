<style>

<body>
<div class="app">

    <div id="mainPanel" class="hidden">

        <div class="girlBox">

</div>

  let state = null;
  let tickerId = null;

  const $ = id => document.getElementById(id);
  const introPanel=$('introPanel'), mainPanel=$('mainPanel'), missionPanel=$('missionPanel'), returnPanel=$('returnPanel');

  const attachVal=$('attachVal'), strangeVal=$('strangeVal'), resentVal=$('resentVal');
  const attachDesc=$('attachDesc'), strangeDesc=$('strangeDesc'), resentDesc=$('resentDesc');
  const traitsArea=$('traitsArea'), worldBox=$('worldBox');
  const speedGrid=$('speedGrid'), travelBtn=$('travelBtn'), resetBtn=$('resetBtn');
  const gameArea=$('gameArea'), endingArea=$('endingArea');

  function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function pickN(arr, n){
    const c = arr.slice();
    const out = [];
    for(let i=0;i<n && c.length;i++){
      out.push(c.splice(Math.floor(Math.random()*c.length),1)[0]);
    }
    return out;
  }
  function title(){ return state.role==='father'?'爸爸':'妈妈'; }

  function descAttach(v){
    if(v>=85) return '你是她的全部';
    if(v>=65) return '她深深爱着你';
    if(v>=45) return '她把你放在心上';
    if(v>=25) return '她还在意你';
    if(v>=10) return '她偶尔想起你';
    return '她几乎忘了你';
  }
  function descStrange(v){
    if(v>=85) return '她已认不出你';
    if(v>=65) return '你对她像个陌生人';
    if(v>=45) return '她对你有些疏远';
    if(v>=25) return '她对你还有点距离';
    if(v>=10) return '她记得你的样子';
    return '你对她无比熟悉';
  }
  function descResent(v){
    if(v>=85) return '她恨了你一生';
    if(v>=65) return '她心里有很深的怨';
    if(v>=45) return '她对你有些埋怨';
    if(v>=25) return '她偶尔会怨你';
    if(v>=10) return '她有一点点不满';
    return '她从不怪你';
  }

  function initState(){
    return {
      role:'father',
      named:false,
      name:'明月',
      ageMonths: 8*12,
      targetAgeMonths: 0,
      playerTrips: 0,
      meetings: 0,
      memories: [],
      alive: true,
      aliveYears: 0,
      speed: 'y3',
      introDone: false,
      ended: false,
      // 任务
      missionStartReal: 0,
      missionAccumulated: 0,
      missionRunning: false,
      missionRunningSince: 0,
      missionYears: 0,
      missionMinutes: 0,
      missionTargetSeconds: 0,
      // 感情
      attachment: 0,
      strangeness: 0,
      resentment: 0,
      // 性格
      personality: null,
      hobby: null,
      orientation: null,
      world: null,
      // 选择
      choicesMade: [],
      flags: {},
      lifelog: [],
      letters: [],
      pendingChoice: null,
      choiceResult: null,
      romanceSeen: [],
      timeline: []
    };
  }

  function ageYears(){ return state.ageMonths / 12; }
  function ageText(){
    const m = state.ageMonths;
    if(m < 12) return Math.floor(m) + ' 个月';
    const y = m/12;
    if(y < 3) return y.toFixed(1) + ' 岁';
    return Math.floor(y) + ' 岁';
  }
  function getStage(){
    if(!state.alive) return 'gone';
    const y = ageYears();
    if(y < 12) return 'child';
    if(y < 18) return 'teen';
    if(y < 30) return 'adult';
    if(y < 60) return 'middle';
    return 'old';
  }
  function getEmoji(){
    if(!state.alive) return '⚱️';
    const y = ageYears();
    if(y < 12) return '👧';
    if(y < 18) return '👩';
    if(y < 30) return '👩‍🦰';
    if(y < 60) return '👩‍🦳';
    return '👵';
  }
  function addLog(t){ state.lifelog.unshift(t); if(state.lifelog.length>120) state.lifelog.pop(); }
  function addMemory(t){ state.memories.push(t); if(state.memories.length>60) state.memories.shift(); }
  function addTimeline(t){ state.timeline.push(t); if(state.timeline.length>40) state.timeline.shift(); }

  function render(){
    if(mainPanel.classList.contains('hidden')) return;
    girlEmoji.textContent = getEmoji();
    girlName.textContent = state.name;
    girlAge.textContent = state.alive ? '她 '+ageText() : '她已经不在了';
    playerTrips.textContent = '第 '+(state.playerTrips+1)+' 次';
    ageVal.textContent = state.alive ? ageText() : '—';
    meetCount.textContent = state.meetings+' 次';
    attachVal.textContent = Math.floor(state.attachment);
    strangeVal.textContent = Math.floor(state.strangeness);
    resentVal.textContent = Math.floor(state.resentment);
    attachDesc.textContent = descAttach(state.attachment);
    strangeDesc.textContent = descStrange(state.strangeness);
    resentDesc.textContent = descResent(state.resentment);

    let sp;
    if(!state.alive) sp = '……她留下的，只有一封信。';
    else sp = rand(SPEECH[getStage()]);
    speechEl.textContent = sp;

    // 世界观展示
    if(state.world){
      worldBox.innerHTML = `
        <div class="worldTag">🌍 她所在的世界</div>
        <div class="worldName">${state.world.emoji} ${state.world.name}</div>
        <div class="worldDesc">${state.world.desc}</div>
      `;
    } else {
      worldBox.innerHTML = '';
    }

    speedGrid.innerHTML = '';
    SPEEDS.forEach(s=>{
      const d = document.createElement('div');
      d.className = 'speedItem' + (state.speed===s.id?' active':'');
      d.innerHTML = `<div class="sp">${s.label}</div><div class="lb">${s.desc}</div>`;
      d.addEventListener('click', ()=>{ state.speed = s.id; render(); });
      speedGrid.appendChild(d);
    });

    const p = state.personality, h = state.hobby, o = state.orientation;
    let orientExtra = '';
    if(o && o.id==='ace') orientExtra = '（她不会结婚生子）';
    if(o && o.id==='homo') orientExtra = '（她会有同性伴侣）';
    if(o && o.id==='bi') orientExtra = '（她可能和任何性别在一起）';
    traitsArea.innerHTML = `
      <div class="traitRow"><span>性格</span><span class="v">${p?p.name:'—'}</span></div>
      <div class="traitRow"><span>爱好</span><span class="v">${h?h.name:'—'}</span></div>
      <div class="traitRow"><span>取向</span><span class="v">${o?o.name:'—'}</span></div>
      <div style="font-size:11px;color:#818cf8;margin-top:4px;">
        ${p?p.desc:''} ${h?'· '+h.desc:''} ${orientExtra}
      </div>
    `;
  }

  // ===== 开场 =====
  function showIntro(){
    mainPanel.classList.add('hidden');
    missionPanel.classList.add('hidden');
    returnPanel.classList.add('hidden');
    introPanel.classList.remove('hidden');

    introPanel.innerHTML = `
      <div class="card fadeIn">
        <div class="bigEmoji">🌌</div>
        <div class="storyText">你是时间旅行者。<br>你能穿行于时间的裂缝之间，<br>看尽王朝覆灭、星辰陨落。</div>
      </div>
      <div class="card fadeIn">
        <div class="storyText">那天，你在一条时间的裂隙里，<br>听见了哭声。</div>
      </div>
      <div class="card fadeIn">
        <div class="bigEmoji">👧</div>
        <div class="storyText">一个孩子。<br>她被时间遗弃了，<br>不知道自己属于哪个时代，<br>也不知道自己是谁。<br><br>她看起来，大约 8 岁。</div>
      </div>
      <div class="card fadeIn">
        <div class="storyText">你伸出手。<br>她犹豫了一下，<br>还是握住了。</div>
        <div class="quote">"从今天起，你就是我的孩子了。"</div>
      </div>
      <div class="card fadeIn">
        <div class="storyText">你带她回家。<br>给她买了柔软的床、漂亮的裙子、很多书。<br>可是你终究是时间旅行者，<br>你必须经常离开。<br>你要去完成你的任务。</div>
      </div>
      <div class="card fadeIn">
        <div class="storyText" style="font-size:15px;color:#fbbf24;">先告诉我，你是谁？</div>
        <div class="roleGrid" id="roleGrid">
          <div class="roleItem" data-role="father"><div class="ico">👨</div><div class="nm">父亲</div></div>
          <div class="roleItem" data-role="mother"><div class="ico">👩</div><div class="nm">母亲</div></div>
        </div>
      </div>
      <div class="card fadeIn" id="nameCard" style="display:none;">
        <div class="storyText" style="font-size:15px;color:#fbbf24;">给她起一个名字</div>
        <input class="nameInput" id="nameInput" value="明月" maxlength="8" autocomplete="off">
        <button class="btn gold" id="nameBtn" style="margin-top:12px;">就叫这个名字</button>
      </div>
    `;

    const roleGrid = $('roleGrid');
    const nameCard = $('nameCard');
    roleGrid.querySelectorAll('.roleItem').forEach(it=>{
      it.addEventListener('click', ()=>{
        roleGrid.querySelectorAll('.roleItem').forEach(x=>x.classList.remove('active'));
        it.classList.add('active');
        state.role = it.dataset.role;
        nameCard.style.display = 'block';
        setTimeout(()=>$('nameInput').focus(), 200);
      });
    });

    $('nameBtn').addEventListener('click', ()=>{
      const n = $('nameInput').value.trim() || '明月';
      state.name = n;
      state.named = true;
      state.introDone = true;
      state.personality = rand(PERSONALITIES);
      state.hobby = rand(HOBBIES);
      state.orientation = rand(ORIENTATIONS);
      state.world = rand(WORLDS);

      addLog('你（'+title()+'）收养了她，取名「'+n+'」。那年她 8 岁。');
      addMemory('你收养了「'+n+'」，那年她 8 岁。');
      addLog('她是一个'+state.personality.name+'的孩子，喜欢'+state.hobby.name+'。');
      addLog('她所在的世界是：'+state.world.name+'。');
      addTimeline('8 岁 · 你收养了她');

      introPanel.classList.add('hidden');
      mainPanel.classList.remove('hidden');
      render();
      save();
    });
  }

  // ===== 启程离开 =====
  function travel(){
    if(!state.named){ showIntro(); return; }
    if(!state.alive){ showEnding(); return; }
    if(state.ended) return;

    const speed = SPEEDS.find(s=>s.id===state.speed);
    state.playerTrips++;
    state.missionYears = speed.years;
    state.missionTargetSeconds = speed.years * SECONDS_PER_YEAR;
    state.missionAccumulated = 0;
    state.missionRunning = false;
    state.targetAgeMonths = state.ageMonths + speed.years * 12;

    save();
    showMission();
  }

  // ===== 任务界面 =====
  function showMission(){
    mainPanel.classList.add('hidden');
    returnPanel.classList.add('hidden');
    missionPanel.classList.remove('hidden');

    const totalMin = Math.ceil(state.missionTargetSeconds / 60);

    missionPanel.innerHTML = `
      <div class="card fadeIn">
        <div class="missionBox">
          <div class="missionTitle">⏳ 你要去完成任务了</div>
          <div class="missionNote">
            你有自己的使命，必须离开。去专注做事吧。<br>
            这段时间里，她也在长大。<br>
            <b style="color:#fbbf24;">需要累计专注 ${totalMin} 分钟</b>，她才会长大 ${state.missionYears} 岁。<br>
            中途有事可以按暂停，回来再继续。<br>
            <span style="color:#a78bfa;">切走 App、锁屏、关掉页面，计时都会继续。</span>
          </div>
          <div id="mStatusTag" class="statusTag paused">⏸ 已暂停</div>
          <div class="missionTime" id="mTime">00:00</div>
          <div class="missionSub" id="mSub">她正在等你回来…</div>
          <div class="progressOuter">
            <div class="progressInner" id="mProgress" style="width:0%"></div>
          </div>
          <div class="missionInfo" id="mInfo"></div>
        </div>
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn gold" id="startMissionBtn" style="flex:1;">▶ 开始专注</button>
        <button class="btn ghost" id="pauseMissionBtn" style="flex:1;">⏹ 暂停</button>
      </div>
      <button class="btn danger small" id="cancelMissionBtn">↩ 返回（放弃这次离开）</button>
    `;

    $('startMissionBtn').addEventListener('click', startMissionTick);
    $('pauseMissionBtn').addEventListener('click', pauseMissionTick);
    $('cancelMissionBtn').addEventListener('click', cancelMission);

    updateMissionDisplay();
    if(state.missionRunning){
      startMissionTick();
    }
  }

  function startMissionTick(){
    if(state.missionRunning) return;
    state.missionRunning = true;
    state.missionRunningSince = Date.now();
    if(tickerId) clearInterval(tickerId);
    tickerId = setInterval(tickMission, 1000);
    updateMissionDisplay();
    save();
  }

  function pauseMissionTick(){
    if(state.missionRunning && state.missionRunningSince){
      const now = Date.now();
      const dt = (now - state.missionRunningSince) / 1000;
      state.missionAccumulated += dt;
    }
    state.missionRunning = false;
    state.missionRunningSince = 0;
    if(tickerId){ clearInterval(tickerId); tickerId = null; }
    updateMissionDisplay();
    save();
  }

  function cancelMission(){
    if(!confirm('放弃这次离开？你还没开始专注，不会有任何变化。')) return;
    if(tickerId){ clearInterval(tickerId); tickerId = null; }
    state.missionRunning = false;
    state.missionRunningSince = 0;
    state.missionAccumulated = 0;
    state.missionTargetSeconds = 0;
    state.missionYears = 0;
    state.playerTrips = Math.max(0, state.playerTrips - 1);
    save();
    missionPanel.classList.add('hidden');
    mainPanel.classList.remove('hidden');
    render();
  }

  function tickMission(){
    if(!state.missionRunning) return;
    const now = Date.now();
    const dt = (now - state.missionRunningSince) / 1000;
    state.missionRunningSince = now;
    state.missionAccumulated += dt;
    updateMissionDisplay();

    if(state.missionAccumulated >= state.missionTargetSeconds){
      state.missionAccumulated = state.missionTargetSeconds;
      pauseMissionTick();
      finishMission();
    }
  }

  function updateMissionDisplay(){
    const mTime = $('mTime');
    const mProgress = $('mProgress');
    const mSub = $('mSub');
    const mInfo = $('mInfo');
    const mTag = $('mStatusTag');
    if(!mTime) return;

    const total = state.missionTargetSeconds;
    const elapsed = Math.min(state.missionAccumulated, total);
    const remain = Math.max(0, total - elapsed);

    const mm = Math.floor(remain/60);
    const ss = Math.floor(remain%60);
    mTime.textContent = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');

    const pct = Math.min(100, (elapsed/total)*100);
    mProgress.style.width = pct+'%';

    const curMonths = state.ageMonths + (elapsed/total) * state.missionYears * 12;
    mSub.textContent = '她正在长大… ' + Math.floor(curMonths/12) + ' 岁';

    if(state.missionRunning){
      mTag.textContent = '▶ 专注中';
      mTag.className = 'statusTag running';
    } else {
      mTag.textContent = '⏸ 已暂停';
      mTag.className = 'statusTag paused';
    }

    mInfo.innerHTML = `你离开后，她将度过 <b style="color:#fbbf24;">${state.missionYears} 年</b>。<br>
      她会从 <b style="color:#fbbf24;">${ageText()}</b> 长到 <b style="color:#fbbf24;">${Math.floor(state.targetAgeMonths/12)} 岁</b>。`;
  }

  // ===== 完成 =====
  function finishMission(){
    if(tickerId){ clearInterval(tickerId); tickerId = null; }
    state.missionRunning = false;
    state.missionRunningSince = 0;

    const years = state.missionYears;
    const startAge = state.ageMonths / 12;
    state.ageMonths = state.targetAgeMonths;
    const endAge = state.ageMonths / 12;
    state.meetings++;

    // 感情变化
    if(years <= 3){
      state.attachment += 10;
      state.strangeness -= 4;
      state.resentment -= 2;
    } else if(years <= 5){
      state.attachment += 5;
      state.strangeness += 1;
      state.resentment -= 1;
    } else if(years <= 10){
      state.attachment += 1;
      state.strangeness += 8;
      state.resentment += 4;
    } else if(years <= 20){
      state.attachment -= 4;
      state.strangeness += 15;
      state.resentment += 10;
    } else {
      state.attachment -= 10;
      state.strangeness += 28;
      state.resentment += 22;
    }

    if(endAge <= 12) state.attachment += 6;
    else if(endAge <= 18) state.attachment += 3;

    state.attachment = Math.max(0, Math.min(100, state.attachment));
    state.strangeness = Math.max(0, Math.min(100, state.strangeness));
    state.resentment = Math.max(0, Math.min(100, state.resentment));

    if(state.ageMonths / 12 >= 85){
      state.alive = false;
      state.aliveYears = state.ageMonths / 12;
    }

    const events = generateLifeEvents(years, endAge, startAge);
    events.forEach(e=> addLog(e.age + '：' + e.text));

    const letter = generateLetter(endAge);
    if(letter) state.letters.push(letter);

    const choice = pickChoice(startAge, endAge);
    if(choice && !state.choicesMade.includes(choice.q)){
      state.pendingChoice = choice;
      state.choicesMade.push(choice.q);
    }

    addMemory('第'+state.playerTrips+'次离开：她 '+Math.floor(startAge)+'→'+Math.floor(endAge)+' 岁。');
    addTimeline(Math.floor(endAge)+' 岁 · 你第'+state.playerTrips+'次归来');

    // 浪漫剧情判定
    let romance = null;
    if(state.alive && endAge >= 10){
      const candidates = ROMANCE_SCENES.filter(r =>
        endAge >= r.ageRange[0] && endAge <= r.ageRange[1] &&
        !state.romanceSeen.includes(r.id)
      );
      if(candidates.length && Math.random() < 0.6){
        romance = rand(candidates);
        state.romanceSeen.push(romance.id);
        addMemory('浪漫瞬间：'+romance.name);
      }
    }

    save();

    if(state.pendingChoice){
      state._romanceForChoice = romance;
      state._eventsForChoice = events;
      state._letterForChoice = letter;
      showChoice();
    } else {
      showReturn(years, endAge, events, letter, null, romance);
    }
  }

  // ===== 选择 =====
  function pickChoice(startAge, endAge){
    for(const c of CHOICES){
      if(endAge >= c.minAge && endAge <= c.maxAge && startAge <= c.maxAge){
        if(!state.choicesMade.includes(c.q)) return c;
      }
    }
    return null;
  }

  function showChoice(){
    const c = state.pendingChoice;
    mainPanel.classList.add('hidden');
    missionPanel.classList.add('hidden');
    returnPanel.classList.remove('hidden');

    returnPanel.innerHTML = `
      <div class="card fadeIn">
        <div class="bigEmoji">💭</div>
        <div class="storyText" style="font-size:15px;color:#fbbf24;">你回来的时候，她问了你一个问题。</div>
      </div>
      <div class="card fadeIn">
        <div class="choiceBox">
          <div class="choiceQ">「${c.q}」</div>
          <button class="choiceBtn" id="choiceA">
            ${c.a.text}
            <div class="choiceEffect">→ ${c.a.effect.desc}</div>
          </button>
          <button class="choiceBtn" id="choiceB">
            ${c.b.text}
            <div class="choiceEffect">→ ${c.b.effect.desc}</div>
          </button>
        </div>
      </div>
    `;

    $('choiceA').addEventListener('click', ()=>makeChoice(c.a, c));
    $('choiceB').addEventListener('click', ()=>makeChoice(c.b, c));
  }

  function makeChoice(opt, c){
    Object.assign(state.flags, opt.flags || {});
    addLog('你选择了：' + opt.text);
    addMemory('她问「'+c.q+'」，你说「'+opt.text+'」。');

    // 统一处理 flag 数值影响
    const f = opt.flags || {};
    const attachUp = ['kind','accept','trust','love','hope','dream','truth','promise','proud','belong','support','rely','remember','tender','accompany','reassure','expect','record','auto','free','free2','acceptLove','self','seek'].filter(k=>f[k]).length;
    const attachDown = ['prag','press','focus','reality','acceptNo','stable','helpless','silent','obey','depend','hide','doubt','press2','close','unsure','worry','letgo','restraint','seal'].filter(k=>f[k]).length;
    const resentUp = ['persist','press','focus','reality','acceptNo','stable','press2','close','doubt','unsure'].filter(k=>f[k]).length;
    const resentDown = ['forgive','forgive2','fate','acceptFate','release','letgo'].filter(k=>f[k]).length;
    const strangeDown = ['free','free2','acceptLove','self'].filter(k=>f[k]).length;
    const strangeUp = ['helpless','distance','hide','unsure'].filter(k=>f[k]).length;

    state.attachment += attachUp*3 - attachDown*2;
    state.resentment += resentUp*2 - resentDown*5;
    state.strangeness += strangeUp*2 - strangeDown*1;

    // 特定 flag 的额外影响
    if(f.forgive || f.forgive2){ state.attachment += 3; }
    if(f.promise){ state.attachment += 4; }
    if(f.belong){ state.attachment += 5; }
    if(f.accompany){ state.attachment += 5; }
    if(f.rely){ state.attachment += 3; }

    state.attachment = Math.max(0, Math.min(100, state.attachment));
    state.strangeness = Math.max(0, Math.min(100, state.strangeness));
    state.resentment = Math.max(0, Math.min(100, state.resentment));

    const choice = state.pendingChoice;
    state.pendingChoice = null;
    state.choiceResult = { opt, choice };

    const years = state.missionYears;
    const endAge = state.ageMonths / 12;
    const startAge = endAge - years;
    const events = state._eventsForChoice || generateLifeEvents(years, endAge, startAge);
    const letter = state._letterForChoice || state.letters[state.letters.length-1] || null;
    const romance = state._romanceForChoice || null;

    state._eventsForChoice = null;
    state._letterForChoice = null;
    state._romanceForChoice = null;

    showReturn(years, endAge, events, letter, { opt, choice }, romance);
  }

  // ===== 事件生成（按主题） =====
  function generateLifeEvents(years, finalAge, startAge){
    const events = [];
    const keys = Object.keys(AGE_THEMES).map(Number).sort((a,b)=>a-b);

    keys.forEach(k=>{
      if(k >= startAge && k < finalAge){
        const themes = AGE_THEMES[k] || ['self'];
        const theme = rand(themes);
        const pool = EVENT_POOL[theme] || EVENT_POOL.self;
        if(pool && pool.length){
          const count = Math.min(pool.length, randInt(1,2));
          const picked = pickN(pool, count);
          picked.forEach(t=>{
            events.push({ age: k+' 岁', text: t });
          });
        }
      }
    });

    // 取向驱动的剧情分支
    const o = state.orientation ? state.orientation.id : 'hetero';
    if(o === 'ace' && finalAge >= 26){
      events.push({ age: Math.floor(finalAge)+' 岁', text: '她选择了不婚。她说，一个人也可以把日子过成花。' });
    }
    if(o === 'homo' && finalAge >= 26){
      events.push({ age: Math.floor(finalAge)+' 岁', text: '她和一个同性的伴侣在一起了。她们说，要一起养一只猫。' });
    }
    if(o === 'bi' && finalAge >= 26){
      events.push({ age: Math.floor(finalAge)+' 岁', text: '她恋爱了。对方是什么性别，她说，「不重要，重要的是人」。' });
    }

    // 关系状态驱动的补充
    if(state.attachment < 20 && state.strangeness > 50){
      events.unshift({ age: Math.floor(finalAge)+' 岁', text: '她已经记不太清你的样子了。' });
    }
    if(state.resentment > 50){
      events.unshift({ age: Math.floor(finalAge)+' 岁', text: '她学会了不再等你。' });
    }
    if(state.attachment > 70){
      events.unshift({ age: Math.floor(finalAge)+' 岁', text: '她一直留着你给她买的第一件东西。' });
    }
    if(state.flags.promise && finalAge > 40){
      events.unshift({ age: Math.floor(finalAge)+' 岁', text: '她在门口放了一盏灯，说怕你回来太黑。' });
    }

    if(events.length === 0){
      events.push({ age: Math.floor(finalAge)+' 岁', text: '时间平静地流过，她又长大了一些。' });
    }
    return events;
  }

  // ===== 信件生成（按年龄 + 取向） =====
  function generateLetter(finalAge){
    if(state.attachment < 25 && finalAge > 25){
      if(Math.random() < 0.7) return null;
      return `「\n我不知道该写什么。\n你走之后，我有很多年没有想起你了。\n——${state.name}」`;
    }
    if(Math.random() < 0.4) return null;

    const y = finalAge;
    const o = state.orientation ? state.orientation.id : 'hetero';
    let pool;
    if(y < 12) pool = LETTERS.child;
    else if(y < 18) pool = LETTERS.teen;
    else if(y < 30){
      if(o === 'ace') pool = LETTERS.adult_ace;
      else if(o === 'homo') pool = LETTERS.adult_homo;
      else pool = LETTERS.adult;
    }
    else if(y < 60) pool = LETTERS.middle;
    else pool = LETTERS.old;

    if(!pool) return null;
    let text = rand(pool);
    text = text.replace(/\{P\}/g, title()).replace(/\{N\}/g, state.name);
    return text;
  }

      } else if(att >= 60 && o === 'homo'){
        title='她找到了她的家'; emoji='🌈';
        desc='她和一个同性的伴侣在一起了。她们没有办婚礼，但她们很幸福。她说，她终于知道，什么是"家"了。';
      } else if(att >= 55 && flags.dream){
        title='追梦的她'; emoji='🌠';
        desc='她辞了职，去做了一件自己真正想做的事。她说，是你教会了她，人生可以不一样。';
      } else if(att >= 50 && flags.kind){
        title='温柔的她'; emoji='🌷';
        desc='她成为了一个善良的人。她收养了一只流浪猫，就像当年你收养她一样。';
      } else if(att >= 50 && flags.persist){
        title='坚持的她'; emoji='🎹';
        desc='她没有放弃钢琴，后来成为了一个演奏者。她说，她一直记得你说过"坚持会感谢自己"。';
      } else if(str >= 75){
        title='一个陌生人'; emoji='🌫️';
        desc='她长大了，但你对她来说，只是一个偶尔出现的陌生人。她有自己的人生了，不需要你。她过得很好。';
      } else if(res >= 75){
        title='她学会了不再等你'; emoji='🌧️';
        desc='她不再恨你，也不再等你。她有了自己的生活，把你放在了很远的角落。她说："我已经不需要了。"';
      } else if(res >= 50 && flags.reality){
        title='现实主义的她'; emoji='💼';
        desc='她选择了最稳妥的路。她过得很好，但她的眼神里，总有一点你读不懂的东西。';
      } else if(flags.truth && flags.protect){
        title='她成为了'+(isF?'母亲':'父亲')+'一样的人'; emoji='🏡';
        desc='她有了自己的孩子。她给孩子讲你的故事，讲的时候，眼睛里有光，也有泪。';
      } else if(y >= 60 && att >= 40){
        title='她还在等你'; emoji='⏳';
        desc='她老了，头发白了。她还在等你下次回来。她说："我知道你会来的。"';
      } else if(meets >= 6 && att >= 40){
        title='她理解了你'; emoji='🌙';
        desc='她长大了，慢慢地理解了你。她知道你有你的世界，也知道你爱她。只是，爱得有点远。';
      } else if(meets >= 4){
        title='她有自己的生活'; emoji='🌿';
        desc='她有了自己的生活、自己的朋友、自己的家。你不在的时候，她也过得很好。这是你想要的吗？';
      } else if(meets <= 2){
        title='几乎陌生的她'; emoji='🌫️';
        desc='你几乎没怎么出现。她的人生里，你只是一道模糊的影子。她过得很好，没有你，也很好。';
      } else {
        title='她还在长大'; emoji='⏳';
        desc='她的故事还没有结束。她还在等你下次回来。';
      }
    }

    gameArea.classList.add('hidden');
    endingArea.classList.remove('hidden');

    const worldLine = state.world ? `${state.world.emoji} ${state.world.name}` : '—';

    const timelineHtml = state.timeline.length ? `
      <div class="timeline">
        <b>🕰 她的时间线</b><br>
        ${state.timeline.map(t=>'· '+t).join('<br>')}
      </div>` : '';

    endingArea.innerHTML = `
      <div class="card fadeIn" style="margin-top:20px;">
        <div class="bigEmoji">${emoji}</div>
        <div class="endingTitle">${title}</div>
        <div class="storyText">${desc}</div>
        <div class="divider">· · ·</div>
        <div class="center" style="font-size:13px;color:#a78bfa;line-height:2;">
          她的名字：${state.name}<br>
          你是她的：${isF?'父亲':'母亲'}<br>
          她的世界：${worldLine}<br>
          她的性格：${state.personality?state.personality.name:'—'}<br>
          她的爱好：${state.hobby?state.hobby.name:'—'}<br>
          她的取向：${state.orientation?state.orientation.name:'—'}<br>
          你旅行了 ${state.playerTrips} 次<br>
          你们相见 ${meets} 次<br>
          依恋 ${Math.floor(att)} · 陌生 ${Math.floor(str)} · 怨恨 ${Math.floor(res)}<br>
          她最后 ${state.alive ? ageText() : '不在人世（' + Math.floor(years) + ' 岁）'}
        </div>
        ${timelineHtml}
        ${mems.length ? `
        <div class="memories">
          <b>📜 记忆碎片</b><br>
          ${mems.slice(-18).map(m=>'· '+m).join('<br>')}
        </div>` : ''}
        <button class="btn gold" id="againBtn" style="margin-top:14px;">🔁 时间倒流，重新开始</button>
      </div>
    `;
    $('againBtn').addEventListener('click', resetGame);
    localStorage.removeItem(SAVE_KEY);
  }

  // ===== 重置 =====
  function resetGame(){
    if(tickerId){ clearInterval(tickerId); tickerId = null; }
    localStorage.removeItem(SAVE_KEY);
    state = initState();
    endingArea.classList.add('hidden');
    gameArea.classList.remove('hidden');
    mainPanel.classList.add('hidden');
    missionPanel.classList.add('hidden');
    returnPanel.classList.add('hidden');
    introPanel.classList.add('hidden');
    showIntro();
  }

  // ===== 保存/读取 =====
  function save(){
    try{
      if(state.missionRunning && state.missionRunningSince){
        const now = Date.now();
        state.missionAccumulated += (now - state.missionRunningSince) / 1000;
        state.missionRunningSince = now;
      }
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }catch(e){}
  }

  function load(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw) return false;
      const d = JSON.parse(raw);
      if(!d || d.ended) return false;
      state = Object.assign(initState(), d);

      // 兼容旧存档：如果没有 world，就随机一个
      if(!state.world) state.world = rand(WORLDS);

      if(state.missionRunning && state.missionRunningSince){
        const now = Date.now();
        const dt = (now - state.missionRunningSince) / 1000;
        state.missionAccumulated += dt;
        state.missionRunningSince = now;

        if(state.missionAccumulated >= state.missionTargetSeconds){
          state.missionAccumulated = state.missionTargetSeconds;
        }
      }
      return true;
    }catch(e){ return false; }
  }

  // ===== 启动 =====
  state = initState();
  const loaded = load();

  if(loaded && state.introDone){
    if(state.missionTargetSeconds && state.missionAccumulated < state.missionTargetSeconds){
      gameArea.classList.remove('hidden');
      mainPanel.classList.add('hidden');
      introPanel.classList.add('hidden');
      showMission();
      if(state.missionRunning){
        startMissionTick();
      }
    } else if(state.missionTargetSeconds && state.missionAccumulated >= state.missionTargetSeconds){
      gameArea.classList.remove('hidden');
      mainPanel.classList.add('hidden');
      introPanel.classList.add('hidden');
      finishMission();
    } else {
      gameArea.classList.remove('hidden');
      mainPanel.classList.remove('hidden');
      introPanel.classList.add('hidden');
      render();
    }
  } else {
    state.introDone = true;
    showIntro();
  }

  travelBtn.addEventListener('click', travel);
  resetBtn.addEventListener('click', ()=>{
    if(confirm('确定重新开始吗？时间会倒流。')) resetGame();
  });

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) save();
    else {
      if(state && state.missionRunning){
        const now = Date.now();
        if(state.missionRunningSince){
          const dt = (now - state.missionRunningSince) / 1000;
          state.missionAccumulated += dt;
          state.missionRunningSince = now;
        }
        if(state.missionAccumulated >= state.missionTargetSeconds){
          state.missionAccumulated = state.missionTargetSeconds;
          finishMission();
        } else if(missionPanel && !missionPanel.classList.contains('hidden')){
          updateMissionDisplay();
        }
      }
    }
  });

  window.addEventListener('beforeunload', save);

  document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
})();
</script>
</body>
</html>
